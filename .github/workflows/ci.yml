name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: mypy backend/app --ignore-missing-imports --no-incremental
      - run: pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-report=xml
      - run: python -m backend.evals.run
      - name: Verify fresh and repeated migrations
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini upgrade head
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up --build -d
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker compose down
        if: always()
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: julu-ai:test}
