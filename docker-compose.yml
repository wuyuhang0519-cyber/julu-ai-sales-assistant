services:
  app:
    build: .
    ports: ["8001:8000"]
    environment:
      DATABASE_URL: sqlite:///./data/julu.db
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-demo-secret-change-me}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORE_RAW_AI_RESPONSE: ${STORE_RAW_AI_RESPONSE:-false}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-local}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_CALENDAR_INVITE_ATTENDEES: ${GOOGLE_CALENDAR_INVITE_ATTENDEES:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      EMAIL_TEST_ALLOWLIST: ${EMAIL_TEST_ALLOWLIST:-}
      FOLLOWUP_SCHEDULER_ENABLED: ${FOLLOWUP_SCHEDULER_ENABLED:-true}
      FOLLOWUP_DEMO_DELAY_SECONDS: ${FOLLOWUP_DEMO_DELAY_SECONDS:-60}
      FOLLOWUP_CHANNELS: ${FOLLOWUP_CHANNELS:-email}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_TEST_ALLOWLIST: ${WHATSAPP_TEST_ALLOWLIST:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      SALESFORCE_INSTANCE_URL: ${SALESFORCE_INSTANCE_URL:-}
      SALESFORCE_ACCESS_TOKEN: ${SALESFORCE_ACCESS_TOKEN:-}
      CRM_DRY_RUN: ${CRM_DRY_RUN:-true}
      QUOTE_CURRENCY: ${QUOTE_CURRENCY:-CNY}
      QUOTE_VALID_DAYS: ${QUOTE_VALID_DAYS:-14}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.04}
    volumes:
      - julu_data:/app/data
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
volumes:
  julu_data:
